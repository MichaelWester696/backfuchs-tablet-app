name: Build & Deploy Web App (PWA)

# Baut die Flutter-App als Web-App/PWA und veröffentlicht sie auf GitHub Pages.
# Läuft automatisch bei jedem Push auf main, oder manuell über "Run workflow".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Flutter SDK einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: Web-Build erzeugen
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Build-Artefakt für Pages hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
