; Waagen-Knoten: liest die Ohaus-Waage (RS-232 über MAX3232) und stellt die
; Zeilen per WebSocket (Port 81) im WLAN bereit.
[env:esp32s2]
platform = espressif32@^6.9.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_WAAGE_RX=5
    -DPIN_WAAGE_TX=4
lib_deps =
    links2004/WebSockets@^2.4.1
