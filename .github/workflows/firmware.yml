name: Firmware Waagen-Knoten (ESP32-S2)

# Baut die Firmware des Waagen-Knotens. Das fertige Abbild (factory.bin) liegt
# danach als Artefakt am Lauf und wird mit esptool-js im Browser auf den
# ESP32 gespielt (Adresse 0x0).
on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/waagen-knoten/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/waagen-knoten
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Bauen
        run: pio run

      - name: Gesamtabbild erzeugen (factory.bin)
        run: |
          B=.pio/build/esp32s2
          BOOT_APP0=$(ls $HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin)
          python $HOME/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s2 merge_bin \
            -o factory.bin --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT_APP0 0x10000 $B/firmware.bin
          ls -l factory.bin

      - uses: actions/upload-artifact@v4
        with:
          name: waagen-knoten-firmware
          path: |
            firmware/waagen-knoten/factory.bin
            firmware/waagen-knoten/.pio/build/esp32s2/firmware.bin
